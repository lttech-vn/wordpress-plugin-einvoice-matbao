# Overlay for scripts/smoke-zip.sh: the plugin is NOT mounted from the source tree, so only
# what the release zip contains can run. Same images and database as ../compose.yaml.
services:
  wordpress:
    ports: !reset []
    environment:
      EINV_SITE_URL: "http://localhost"
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: "define( 'WP_DEBUG_LOG', true ); define( 'WP_DEBUG_DISPLAY', false );"
    volumes: !override
      - wordpress:/var/www/html
