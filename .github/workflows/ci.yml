name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Build admin assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Assert admin CSS is scoped (no global preflight)
        run: bun run check:css-scope
      - name: Assert no CDN references in built assets
        run: |
          test -s assets/dist/admin.css
          test -s assets/dist/htmx.min.js
          test -s assets/dist/checkout.js
          ! grep -rEl 'https?://(cdn|unpkg|cdnjs|jsdelivr)' assets/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assets-dist
          path: assets/dist

  php:
    name: Lint, static analysis and integration tests (Docker)
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: einv-ci
      EINV_HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker compose build
      - name: Start WordPress + WooCommerce
        run: |
          docker compose up -d --wait
          docker compose exec -T wordpress einv-setup
      - name: PHPCS
        run: docker compose exec -T -w /var/www/html/wp-content/plugins/einvoice-matbao wordpress composer lint
      - name: PHPStan
        run: docker compose exec -T -w /var/www/html/wp-content/plugins/einvoice-matbao wordpress composer analyse
      - name: PHPUnit (with WooCommerce)
        run: docker compose exec -T -w /var/www/html/wp-content/plugins/einvoice-matbao wordpress composer test:integration
      - name: PHPUnit (without WooCommerce)
        run: docker compose exec -T -w /var/www/html/wp-content/plugins/einvoice-matbao wordpress composer test:without-woocommerce
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v

  e2e:
    name: Browser E2E (replay, no model)
    # Not on pull requests (decision: gate on main and on release). workflow_call from release.yml keeps the caller's event.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install E2E runner
        working-directory: tests/e2e
        run: bun install --frozen-lockfile
      - name: Run E2E from the committed cache
        working-directory: tests/e2e
        run: bun run e2e:replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-results
          path: tests/e2e/test-results
          if-no-files-found: ignore
