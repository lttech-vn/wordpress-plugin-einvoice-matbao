name: Assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assets:
    name: Build admin assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Assert admin CSS is scoped (no global preflight)
        run: bun run check:css-scope
      - name: Assert no CDN references in built assets
        run: |
          test -s assets/dist/admin.css
          test -s assets/dist/htmx.min.js
          test -s assets/dist/checkout.js
          ! grep -rEl 'https?://(cdn|unpkg|cdnjs|jsdelivr)' assets/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assets-dist
          path: assets/dist
